[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# URL is overridden at runtime by env.py reading DATABASE_URL from the environment.
# Local dev (SQLite):
sqlalchemy.url = sqlite:///./store.db
# Production (MS SQL Server) — set via DATABASE_URL env var instead of editing here:
# sqlalchemy.url = mssql+pyodbc://behazeld_app:Password@localhost/BeHAZELD?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
